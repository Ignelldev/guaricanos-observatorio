services:
  - type: web
    name: guaricanos-observatorio
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SCHOOL_SESSION_SECRET
        generateValue: true
      - key: SCHOOL_DATA_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: guaricanos-datos
          property: connectionString
databases:
  - name: guaricanos-datos
    plan: free
    region: virginia
    ipAllowList: []
